name: Publish Python 🐍 distribution 📦 to PyPI

on:
  release:
    # `published` rather than `created`: creating a draft release fires
    # `created` too, which would push the draft's tag to PyPI before anyone
    # meant to release it. PyPI has no undo for that.
    types: [published]

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        # setuptools-scm derives the version from `git describe`, so the whole
        # history and every tag has to be present. The default shallow, tagless
        # checkout would produce a 0.1.devN version instead of the release's.
        fetch-depth: 0
        # Nothing here pushes back to the repository, so leave no token behind
        # for the build to pick up.
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sqlelf
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and attach them to the GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for attaching release assets
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    # On a published release the action attaches every signing artifact --
    # the dists, their sigstore bundles, and bundles for the release's own
    # source archives -- to the release itself, through its
    # release-signing-artifacts input, which defaults to true. That is why
    # nothing here uploads the assets afterwards: doing so fails with "asset
    # under the same name already exists".
    - name: Sign the dists with Sigstore and attach them to the release
      uses: sigstore/gh-action-sigstore-python@v3.5.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
