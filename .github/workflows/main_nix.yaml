name: "Build & Test (nix)"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result rather than cancelling the matrix on the
      # first failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Pushes what `nix build` produced -- sqlelf and its Python closure -- so a
    # later run substitutes it instead of rebuilding. Only runs that have the
    # secret can push; a pull request from a fork reads the cache and skips the
    # push rather than failing.
    - name: Set up the binary cache
      uses: cachix/cachix-action@v17
      with:
        name: sqlelf
        authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
    - name: Build & check
      run: |
        nix build
        nix flake check
